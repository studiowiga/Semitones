name: Build Semitones VST3

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target Semitones_VST3 --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Recurse "build/Semitones_artefacts/Release/VST3/Semitones.vst3" "out/Semitones.vst3"
          if (Test-Path docs) { Copy-Item -Recurse docs out/docs }
      - uses: actions/upload-artifact@v4
        with:
          name: Semitones-VST3-Windows
          path: out

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Configure (binaire universel Intel + Apple Silicon)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build
        run: cmake --build build --config Release --target Semitones_VST3 --parallel
      - name: Signature locale (ad hoc) et archive
        run: |
          cd build/Semitones_artefacts/Release/VST3
          xattr -cr Semitones.vst3
          codesign --force --deep --sign - Semitones.vst3
          codesign --verify --deep --strict Semitones.vst3
          ditto -c -k --sequesterRsrc --keepParent Semitones.vst3 "$GITHUB_WORKSPACE/Semitones-VST3-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Semitones-VST3-macOS
          path: Semitones-VST3-macOS.zip
          if-no-files-found: error
